# Default society configuration — see configs/loader.py for the schema.
# Every field here can be overridden via the UI or the REST API.
name: "Unnamed Society"
seed: 0
ticks_per_day: 100
days_per_month: 30
months_per_year: 12

population:
  count: 1000
  age_range: [18, 75]
  ideology_distribution:
    liberal: 0.30
    conservative: 0.30
    socialist: 0.20
    libertarian: 0.10
    authoritarian: 0.10
  personality_distribution:
    agreeableness: { high: 0.3, neutral: 0.4, low: 0.3 }
    risk_tolerance: { high: 0.2, neutral: 0.5, low: 0.3 }
  initial_resources:
    money: { mean: 500, sigma: 200 }
    food: { mean: 100, sigma: 20 }
    energy: { mean: 80, sigma: 20 }
    property: { mean: 200, sigma: 150 }
    influence: { mean: 5, sigma: 5 }
    information: { mean: 20, sigma: 10 }
  ai_levels: { level0: 0.90, level1: 0.09, level2: 0.0, level3: 0.01 }

economy:
  # v0.4.2 §5: 所有资源率统一为 per-day，引擎按 dt_days 换算到 per-tick
  # 这样改变 ticks_per_day 不会改变社会真实资源流量（§7 时间分辨率不变性）
  daily:
    food_consumption_per_agent: 5.0     # 每 agent 每天消耗食物（原 0.05/tick × 100 ticks/day）
    energy_consumption_per_agent: 3.0   # 每 agent 每天消耗能量（原 0.03/tick × 100 ticks/day）
  base_income: 3.0
  income_sigma: 2.0
  tax_rate: 0.01
  redistribution: 0.5
  food_production: 1.5
  energy_production: 0.10
  food_critical: 20.0
  recovery_rate: 0.05
  trade_base_price: 1.0
  # v0.4.2 §19: production_multiplier 恢复动力学
  recovery:
    damping: 0.85           # 恢复阻尼：越接近 1.0 恢复越慢（§18 防过冲）
    max_rate_per_day: 0.15  # 每天最大恢复幅度
    disruption_decay_per_day: 0.35  # 临时干扰每天剩余比例（按 dt 换算）

politics:
  movement_strength: 0.01
  influence_strength: 0.01
  inertia: 0.95
  inertia_range: [0.85, 0.98]
  damping: 0.92
  center_stability: 0.005
  ideology_anchor_strength: 0.02
  max_movement_per_tick: 0.03
  # 资源政治力只响应超出正常运行基线的稀缺，以及压力上升沿。
  resource_pressure_baseline: 0.20
  resource_pressure_persistent_scale: 0.12
  resource_pressure_rising_edge_gain: 1.5
  extremism_threshold: 0.7
  noise: 0.001
  # v0.3.1: 三轴独立校准参数 (§37)
  x_axis:
    economic_strength: 0.40
    sensitivity: 1.0
    deadzone: 0.05
    saturation: 1.0
  y_axis:
    authority_strength: 0.03
    security_strength: 0.02
    legitimacy_strength: 0.03
  z_axis:
    autonomy_strength: 0.02
    belonging_strength: 0.02
    group_pressure_strength: 0.02
  axis_weights: { x: 1.0, y: 1.0, z: 1.0 }
  coupling:
    mode: velocity   # velocity | state | hybrid (§22)
    xy: 0.03
    xz: -0.02
    yx: 0.02
    yz: 0.03
    zx: -0.02
    zy: 0.02

social:
  influence_strength: 0.01
  echo_threshold: 0.4
  information_spread: 0.10
  information_delay: 3
  memory_decay: 0.97
  memory_size: 20

relationships:
  avg_degree: 6

# v0.4: 群体系统（§8, §9, §10, §11, §12；enabled=false 用于 ablation §67）
groups:
  enabled: true
  formation:
    threshold: 0.55
    persistence_ticks: 20
  min_size: 3
  max_size: 200
  dissolve:
    cohesion_threshold: 0.25
    persistence_ticks: 15
  split:
    variance_threshold: 0.35
    cohesion_threshold: 0.45
  merge:
    distance_threshold: 0.45
  influence:
    anchor_pull: 0.002
    identity_gain: 0.01

# v0.4: 身份系统（§53）
identity:
  enabled: true
  group_autonomy_decay: 0.005
  identity_decay: 0.95

# v0.4: 信息系统（§32, §33, §36）
information:
  enabled: true
  distortion_rate: 0.02
  rumor_threshold: 0.35
  ingroup_boost: 1.3
  outgroup_penalty: 0.6
  cascade_ratio: 0.25

# v0.4: 行为系统（§44）
behavior:
  enabled: true
  protest_threshold: 0.10
  conflict_threshold: 0.05
  migration_threshold: 0.08

# v0.4: 社会地理（§47）
regions:
  list: ["A", "B", "C"]
  # v0.4.1 §31：区域资源禀赋差异（供给/就业乘数）
  endowments:
    A: { food: 1.0, energy: 1.0, jobs: 0.6 }
    B: { food: 1.2, energy: 0.8, jobs: 0.5 }
    C: { food: 0.8, energy: 1.2, jobs: 0.5 }

# v0.4.1: 资源安全层（§2–§6，连续 sigmoid，禁止硬阈值）
resource_security:
  critical: { food: 20.0, money: 15.0, energy: 10.0, information: 20.0 }
  scale: 0.5
  weights: { survival: 0.35, economic: 0.25, activity: 0.20, decision: 0.20 }

# v0.4.1: 行为参数覆盖（§10–§14，深合并到 engine/behavior/actions.py 默认值）
actions:
  work:    { cost: { energy: 2.0, food: 0.02 } }
  migrate: { cost: { money: 30.0, energy: 15.0 } }
  protest: { cost: { energy: 5.0 } }

# v0.4.1: 群体资源池（§21–§24）
# distribution 0.5：池子必须及时回流，否则成为食物黑洞（实测教训）
group_resources:
  contribution_probability: 0.1
  distribution_probability: 0.5

events:
  frequency: 0.02
  decay_rate: 0.03
  default_duration: 20
  resolution_threshold: 0.05
  # v0.4.5 §19: 每日最大主要事件数
  daily_major_event_budget: 2
  # v0.4.5 §24: 因果延迟（防止即时递归触发）
  causal_delay:
    min_ticks: 5
  # v0.4.5 §51: 每 tick 最大因果深度
  max_causal_depth_per_tick: 2
  # v0.4.5 §2: 外生事件配置（daily probability, not per-tick）
  exogenous:
    enabled: true
    natural_disaster:
      daily_probability: 0.001
    pandemic:
      daily_probability: 0.0001
    external_shock:
      daily_probability: 0.0005
  # v0.4.5 §16-§18: 触发器参数（persistence/hysteresis/cooldown）
  # 注意：这些参数会覆盖 triggers.py 中的默认值
  triggers:
    economic_crisis:
      trigger_threshold: 0.68
      resolve_threshold: 0.45
      persistence_ticks: 100
      cooldown_days: 5
    food_shortage:
      trigger_threshold: 0.25
      resolve_threshold: 0.12
      persistence_ticks: 50
      cooldown_days: 2
    protest:
      trigger_threshold: 0.40
      resolve_threshold: 0.20
      persistence_ticks: 30
      cooldown_days: 2
    political_movement:
      trigger_threshold: 0.55
      resolve_threshold: 0.35
      persistence_ticks: 80
      cooldown_days: 5
    scandal:
      trigger_threshold: 0.50
      resolve_threshold: 0.30
      persistence_ticks: 20
      cooldown_days: 3
  # v0.4.2 §14–§16: 危机状态机参数
  crisis:
    food:
      trigger_threshold: 0.25    # hunger_ratio > 25% → crisis starts (§14)
      resolve_threshold: 0.12    # hunger_ratio < 12% → crisis resolves
      trigger_persistence_ticks: 50  # 条件持续 50 ticks（≈12 小时）才触发（§15）
      cooldown_days: 2           # 解决后 2 天内不重新触发（§16）
    protest:
      trigger_threshold: 0.15
      resolve_threshold: 0.08
      trigger_persistence_ticks: 30
      cooldown_days: 2
    economic:
      trigger_threshold: 0.68
      resolve_threshold: 0.45
      trigger_persistence_ticks: 100
      cooldown_days: 5
    # v0.4.5.2: Recovery parameters
    recovery:
      max_recovery_ticks: 500
      base_recovery_rate: 0.02

stability:
  collapse_variance_threshold: 0.02
  collapse_consecutive_ticks: 20
  boundary_warning_ratio: 0.30
  boundary_critical_ratio: 0.60
  temperature_critical: 0.85

model:
  provider: rule_based
  base_url: "http://127.0.0.1:11434/v1"
  api_key: ""
  model_name: ""

axes:
  x: { name: "经济自由 ↔ 经济管控", positive: "经济自由", negative: "经济管控" }
  y: { name: "自由 ↔ 权威", positive: "权威", negative: "自由" }
  z: { name: "个人主义 ↔ 集体主义", positive: "个人主义", negative: "集体主义" }
